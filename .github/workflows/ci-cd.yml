name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-agent:
    name: Test Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Syntax check
        run: python -m py_compile agent/*.py

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 agent/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy agent/ --ignore-missing-imports || true

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint --if-present

      - name: Build
        run: cd frontend && npm run build

      - name: Type check (tsc)
        run: cd frontend && npx tsc --noEmit || true
