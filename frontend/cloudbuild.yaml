steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "--build-arg=NEXT_PUBLIC_AGENT_URL=${_AGENT_URL}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/sitemedic/sitemedic-frontend:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/sitemedic/sitemedic-frontend:latest"]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/sitemedic/sitemedic-frontend:latest"

substitutions:
  _REGION: "us-central1"
  _AGENT_URL: ""
  _FIREBASE_PROJECT_ID: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_API_KEY: ""
  _FIREBASE_APP_ID: ""
